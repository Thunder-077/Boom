name: Rolling Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 每天凌晨 2 点（北京时间，即 UTC 18:00）自动运行
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  rolling-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebView2
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?linkid=2124701' -OutFile 'MicrosoftEdgeWebview2Setup.exe'
          Start-Process -FilePath 'MicrosoftEdgeWebview2Setup.exe' -ArgumentList '/silent', '/install' -Wait

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 关键步骤：在远程强制重新打上 rolling 标签，确保标签位置始终处于最新的 commit
      - name: Update rolling tag
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 本地删除已有 tag 重新创建，防止冲突
          git tag -d rolling 2>$null
          git tag rolling
          
          # 强制推送 Tag 指针到 GitHub 远程仓库
          git push origin :refs/tags/rolling 2>$null
          git push origin rolling --force

      # 使用 tauri-action 进行构建，并将产物上传覆盖到名为 rolling 的 Release 下
      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: rolling
          releaseName: 'BOOM Rolling Build'
          releaseBody: |
            这是最新的滚动开发测试版（由 GitHub Actions 自动编译覆盖）。
            
            - **编译时间**：${{ github.event.head_commit.timestamp || '手动/定时触发构建' }}
            - **最新提交**：${{ github.event.head_commit.message || '无' }} (${{ github.sha }})
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          includeRelease: true
