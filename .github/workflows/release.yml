name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebView2
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?linkid=2124701' -OutFile 'MicrosoftEdgeWebview2Setup.exe'
          Start-Process -FilePath 'MicrosoftEdgeWebview2Setup.exe' -ArgumentList '/silent', '/install' -Wait

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release notes from commits
        shell: pwsh
        run: |
          $prevTag = git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>$null
          $range = if ($LASTEXITCODE -eq 0 -and $prevTag) { "$prevTag..HEAD" } else { "HEAD" }
          $commits = git log $range --pretty=format:"%s" --no-merges
          $lines = $commits -split '\r?\n' | Where-Object { $_ -match '^\w+(\(.+\))?!?:' }

          $features = @(); $fixes = @(); $refactors = @(); $others = @()

          foreach ($line in $lines) {
            $clean = $line -replace '^\w+(\(.+\))?!?:\s*', ''
            switch -Regex ($line) {
              '^feat'   { $features += "- $clean" }
              '^fix'    { $fixes += "- $clean" }
              '^refactor|^perf' { $refactors += "- $clean" }
              default   { $others += "- $clean" }
            }
          }

          $body = @()
          if ($features.Count)   { $body += "### ✨ 新增"; $body += $features; $body += "" }
          if ($fixes.Count)      { $body += "### 🐛 修复"; $body += $fixes; $body += "" }
          if ($refactors.Count)  { $body += "### ⚡ 优化"; $body += $refactors; $body += "" }
          if ($others.Count)     { $body += "### 🔧 其他"; $body += $others; $body += "" }
          if ($body.Count -eq 0) { $body = @("暂无更新说明") }

          ($body -join "`n") | Out-File -FilePath release_notes.txt -Encoding utf8 -NoNewline

      - name: Check if pre-release
        id: check-prerelease
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -match '-(alpha|beta|rc)') {
            echo "is_prerelease=true" >> $env:GITHUB_OUTPUT
            write-host "Detected pre-release version: ${{ github.ref_name }}"
          } else {
            echo "is_prerelease=false" >> $env:GITHUB_OUTPUT
            write-host "Detected stable release version: ${{ github.ref_name }}"
          }

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Boom v__VERSION__'
          releaseBodyFile: release_notes.txt
          releaseDraft: false
          prerelease: ${{ steps.check-prerelease.outputs.is_prerelease == 'true' }}
          includeUpdaterJson: true
